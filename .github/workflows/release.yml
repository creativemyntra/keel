name: Release & Distribute Keel

on:
  push:
    tags:
      - 'v*.*.*'           # Triggers on: git tag v2.1.0 && git push --tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.1.1) — leave blank to use tag'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PLUGIN_NAME: keel

jobs:
  # ─────────────────────────────────────────────
  # 1. Validate & determine version
  # ─────────────────────────────────────────────
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag:     ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: RELEASE MANAGER GATE - Comprehensive Version Audit
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "RELEASE MANAGER ENFORCEMENT: Comprehensive Version Audit"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          node scripts/version-audit-comprehensive.cjs
          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ RELEASE BLOCKED: Version audit failed"
            echo "   Release manager must fix all version mismatches before proceeding"
            exit 1
          fi
          echo ""
          echo "✅ RELEASE APPROVED: All 11 version files match"
          echo "   Ready to proceed with build and distribution"

  # ─────────────────────────────────────────────
  # 1b. Test Validation (Pre-Release Quality Gate)
  # ─────────────────────────────────────────────
  test-validation:
    name: Test Suite Validation
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: QUALITY GATE - Run Full Test Suite
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "RELEASE QUALITY GATE: Full Test Suite Validation"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Running: npm test"
          echo ""
          npm test
          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ RELEASE BLOCKED: Test suite failed"
            echo "   All tests must PASS before releasing to production"
            echo ""
            echo "   Action: Fix failing tests and try release again"
            exit 1
          fi
          echo ""
          echo "✅ QUALITY GATE PASSED: All tests passing"
          echo "   Safe to proceed with build and distribution"

  # ─────────────────────────────────────────────
  # 2. Build plugin bundle (.plugin zip)
  # ─────────────────────────────────────────────
  build-plugin:
    name: Build Plugin Bundle
    runs-on: ubuntu-latest
    needs: [prepare, test-validation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild CodeGraph
        run: node scripts/build-codegraph.cjs

      - name: Package .plugin bundle
        run: bash bin/package-plugin.sh ${{ needs.prepare.outputs.version }}

      - name: Verify bundle
        run: |
          BUNDLE="dist/keel-${{ needs.prepare.outputs.version }}.plugin"
          if [ ! -f "$BUNDLE" ]; then
            echo "❌ Plugin bundle not found: $BUNDLE"
            exit 1
          fi
          echo "✅ Bundle created: $BUNDLE ($(du -sh $BUNDLE | cut -f1))"
          unzip -l "$BUNDLE" | head -30

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundle
          path: dist/*.plugin
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. Create GitHub Release
  # ─────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-plugin]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin bundle
        uses: actions/download-artifact@v4
        with:
          name: plugin-bundle
          path: dist/

      - name: INSTALL INTEGRITY GATE - Verify Keel Doctor Passes on Release
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "INSTALL INTEGRITY CHECK: Verifying released code is healthy"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "Running keel-doctor against release tag..."
          echo ""
          node scripts/keel-doctor.cjs
          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ INSTALL INTEGRITY CHECK FAILED"
            echo "   Released plugin would have broken hooks or missing gates"
            echo "   Release BLOCKED until install health check passes"
            exit 1
          fi
          echo ""
          echo "✅ INSTALL INTEGRITY PASSED"
          echo "   Released code is fully wired and functional"

      - name: TAG CREATION GUARD - Validate All Versions Before Release
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "TAG VALIDATION: Ensuring all 11 version files match"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          node scripts/validate-tag-creation.cjs ${{ needs.prepare.outputs.tag }}
          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ TAG VALIDATION FAILED"
            echo "   Release blocked: Version mismatches found"
            echo "   This is a critical gate - all 11 files must match before release"
            exit 1
          fi
          echo ""
          echo "✅ TAG VALIDATION PASSED"
          echo "   All 11 critical files match the release version"
          echo "   Safe to proceed with GitHub release"

      - name: RELEASE NOTES VALIDATION - Verify CHANGELOG Entry
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "RELEASE NOTES VALIDATION: Checking CHANGELOG.md"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Looking for: ## [$VERSION]"
          echo ""

          # Check if CHANGELOG entry exists
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "✅ CHANGELOG.md entry found for v$VERSION"
            echo ""
          else
            echo "❌ CHANGELOG.md entry NOT FOUND for v$VERSION"
            echo ""
            echo "Release BLOCKED: CHANGELOG.md must have an entry for this version"
            echo ""
            echo "Required format in CHANGELOG.md:"
            echo "## [$VERSION]"
            echo "### Added"
            echo "- Feature description"
            echo "### Fixed"
            echo "- Bug fix description"
            echo ""
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          NOTES=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for full details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Keel ${{ needs.prepare.outputs.tag }}"
          body: |
            ## Keel AI-SDLC Framework ${{ needs.prepare.outputs.tag }}

            ${{ steps.changelog.outputs.notes }}

            ---

            ### Install

            **Claude Code Plugin (recommended)**
            ```
            /plugin add marketplace keel
            ```

            **GitHub Action**
            ```yaml
            uses: creativemyntra/keel@${{ needs.prepare.outputs.tag }}
            ```
          files: |
            dist/keel-${{ needs.prepare.outputs.version }}.plugin
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: false
          make_latest: ${{ !contains(needs.prepare.outputs.version, '-') }}

  # ─────────────────────────────────────────────
  # 4. Post-Release Verification
  # ─────────────────────────────────────────────
  verify-release:
    name: Verify Release Artifacts
    runs-on: ubuntu-latest
    needs: [prepare, github-release]
    if: needs.github-release.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: POST-RELEASE VERIFICATION - Verify All Artifacts & Hook Wiring
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "POST-RELEASE VERIFICATION: Checking distributed artifacts"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          node scripts/verify-release-artifacts.cjs ${{ needs.prepare.outputs.tag }}
          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ POST-RELEASE VERIFICATION FAILED"
            echo "   Release has critical issues:"
            echo "   - Version mismatches in distributed artifacts, OR"
            echo "   - Hook wiring incomplete (G-10 classify-gate not fully wired), OR"
            echo "   - Missing security gates in released code"
            echo ""
            echo "   Manual verification and remediation required immediately"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # 5. Notify on failure
  # ─────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [github-release, verify-release]
    if: always() && (needs.github-release.result == 'failure' || needs.verify-release.result == 'failure')
    steps:
      - name: Post failure summary
        run: |
          echo "## ❌ Release Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release workflow encountered failures. Check the job logs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.github-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Post-Release Verification | ${{ needs.verify-release.result }} |" >> $GITHUB_STEP_SUMMARY
