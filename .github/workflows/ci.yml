name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Engine tests + phase-drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify package-lock.json is tracked
        run: git ls-files --error-unmatch package-lock.json

      - name: Install dependencies (from lockfile)
        run: npm ci

      - run: npm test

      - name: Verify audit log integrity
        run: node scripts/test-audit-log-integrity.cjs

      - name: Verify model tiering (feature story)
        run: node scripts/headless-orchestrator.cjs --story CI-FEATURE-001 --feature "CI model tiering verification" --scope feature

      - name: Verify model tiering (defect story)
        run: node scripts/headless-orchestrator.cjs --story CI-DEFECT-001 --feature "CI defect express-lane tiering" --scope defect

      - name: Rebuild CodeGraph
        run: node scripts/build-codegraph.cjs

      - name: Commit updated CodeGraph (push events only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keel/graph/codegraph.json
          if git diff --cached --quiet; then
            echo "CodeGraph unchanged — nothing to commit"
          else
            git commit -m "chore(codegraph): regenerate [skip ci]"
            git push
          fi
