name: Generate Release Runbook

on:
  # Manual trigger (always available)
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Jira ticket key (e.g., H30-1, PROJ-456)'
        required: true
      timezone:
        description: 'Timezone for release times (default: America/Los_Angeles)'
        required: false
        default: 'America/Los_Angeles'

  # Future: Automatic trigger on Jira issue creation
  # (Requires Jira webhook configured)
  # jira:
  #   types: [created, updated]
  #   projects: ['H30', 'PROJ']
  #   issueTypes: ['Release', 'Epic']

env:
  NODE_VERSION: '20'

jobs:
  generate-runbook:
    name: Generate Release Runbook
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      runbook_path: ${{ steps.generate.outputs.runbook_path }}
      runbook_url: ${{ steps.generate.outputs.runbook_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Release Runbook
        id: generate
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "GENERATING RELEASE RUNBOOK"
          echo "═══════════════════════════════════════════════════════"
          echo ""

          TICKET="${{ github.event.inputs.ticket }}"
          TIMEZONE="${{ github.event.inputs.timezone }}"

          echo "Ticket: $TICKET"
          echo "Timezone: $TIMEZONE"
          echo ""

          # Run generator
          node scripts/generate-release-runbook.cjs --ticket "$TICKET" --timezone "$TIMEZONE"

          if [ $? -eq 0 ]; then
            # Find the generated runbook file
            RUNBOOK_FILE=$(find docs/releases -name "*-RUNBOOK.md" -type f -mmin -1 | head -1)

            if [ -z "$RUNBOOK_FILE" ]; then
              # Fallback: use most recently modified file
              RUNBOOK_FILE=$(ls -t docs/releases/*-RUNBOOK.md 2>/dev/null | head -1)
            fi

            echo ""
            echo "✅ Runbook generated: $RUNBOOK_FILE"
            echo ""

            # Set output for next steps
            echo "runbook_path=$RUNBOOK_FILE" >> "$GITHUB_OUTPUT"
            echo "runbook_url=https://github.com/${{ github.repository }}/blob/${{ github.ref }}/$(echo $RUNBOOK_FILE | sed 's/^\.\///')" >> "$GITHUB_OUTPUT"
            echo "runbook_name=$(basename $RUNBOOK_FILE)" >> "$GITHUB_OUTPUT"

          else
            echo ""
            echo "❌ Failed to generate runbook"
            exit 1
          fi

      - name: Create/Update Pull Request
        if: github.event.inputs.ticket != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const runbookPath = '${{ steps.generate.outputs.runbook_path }}';
            const runbookName = '${{ steps.generate.outputs.runbook_name }}';
            const ticket = '${{ github.event.inputs.ticket }}';

            // Check if file exists
            if (!fs.existsSync(runbookPath)) {
              console.log('⚠️  Runbook file not found:', runbookPath);
              return;
            }

            // Read first few lines for preview
            const content = fs.readFileSync(runbookPath, 'utf8');
            const lines = content.split('\n').slice(0, 20).join('\n');

            // Create PR body
            const prBody = `## Release Runbook Generated

🚀 Runbook for **${ticket}** has been generated and is ready for use.

### File
\`\`\`
${runbookPath}
\`\`\`

### Contents Preview
\`\`\`markdown
${lines}
...
\`\`\`

### Next Steps
1. Review the runbook: [${runbookName}](./${runbookPath})
2. Share with release manager
3. Execute day-by-day checklist during release

### Release Timeline
The runbook includes:
- Pre-release preparation (5 days)
- Go-No-Go decision call
- Staged rollout (10% → 50% → 100%)
- 72-hour intensive monitoring
- Post-release retrospective

---
*Generated by Release Runbook Generator*
*Timezone: ${{ github.event.inputs.timezone }}*
*Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')*
`;

            console.log('Creating/updating PR with runbook...');

      - name: Commit and Push Runbook
        if: github.event.inputs.ticket != ''
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: generate release runbook for ${{ github.event.inputs.ticket }}'
          file_pattern: 'docs/releases/*.md'
          commit_options: '--no-verify'
          skip_fetch: false
          skip_checkout: false

      - name: Comment on Workflow Run
        uses: actions/github-script@v7
        with:
          script: |
            const runbookUrl = '${{ steps.generate.outputs.runbook_url }}';
            const runbookPath = '${{ steps.generate.outputs.runbook_path }}';
            const runbookName = '${{ steps.generate.outputs.runbook_name }}';

            github.rest.actions.createWorkflowRunComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              body: `## ✅ Release Runbook Generated

📋 **${runbookName}**

### Quick Links
- 📖 [View Runbook](${runbookUrl})
- 🔗 [Raw File](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${runbookPath})

### Release Timeline
- **Ticket:** ${{ github.event.inputs.ticket }}
- **Timezone:** ${{ github.event.inputs.timezone }}
- **Generated:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

The runbook is ready to be shared with the release manager and team.

---
*Use the runbook checklist to guide your release execution*
`
            });

      - name: Print Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "RELEASE RUNBOOK GENERATED SUCCESSFULLY"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "📋 Runbook: ${{ steps.generate.outputs.runbook_name }}"
          echo "📁 Path: ${{ steps.generate.outputs.runbook_path }}"
          echo "🔗 View: ${{ steps.generate.outputs.runbook_url }}"
          echo ""
          echo "Next Steps:"
          echo "  1. Review the generated runbook"
          echo "  2. Share with release manager"
          echo "  3. Execute day-by-day instructions"
          echo ""
          echo "All dates calculated from ticket due date:"
          echo "  - Go-No-Go: 5 days before"
          echo "  - War Room: 1 day before rollout"
          echo "  - 10% Rollout: Release date - 4 days"
          echo "  - 50% Rollout: Release date - 3 days"
          echo "  - 100% Rollout: Release date - 2 days"
          echo "  - Release Complete: Ticket due date"
          echo ""

  # Upload as artifact
  upload-artifact:
    name: Upload Runbook Artifact
    runs-on: ubuntu-latest
    needs: generate-runbook
    if: needs.generate-runbook.outputs.runbook_path != ''
    steps:
      - name: Download artifact
        uses: actions/checkout@v4

      - name: Upload runbook
        uses: actions/upload-artifact@v4
        with:
          name: release-runbook
          path: ${{ needs.generate-runbook.outputs.runbook_path }}
          retention-days: 90
