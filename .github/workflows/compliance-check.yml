name: Compliance Check (Required Status Check)

# Runs on every push to any branch, on PR creation/update
# This is the AUTHORITATIVE compliance gate (cannot be bypassed by --no-verify or web UI)
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  compliance:
    name: Compliance Evaluation
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Detect compliance-scoped stories
        id: detect
        run: |
          # Find all .keel/state/*/manifest.json files with compliance_scopes
          stories_to_check=$(find .keel/state -name "manifest.json" -exec grep -l "compliance_scopes" {} \; 2>/dev/null | cut -d'/' -f3 | sort -u)
          echo "stories=$stories_to_check" >> $GITHUB_OUTPUT

          if [ -z "$stories_to_check" ]; then
            echo "No compliance-scoped stories found. Skipping detailed checks."
          else
            echo "Found compliance-scoped stories: $stories_to_check"
          fi

      - name: Run compliance checks for each story
        id: compliance
        run: |
          set -e

          stories="${{ steps.detect.outputs.stories }}"
          if [ -z "$stories" ]; then
            echo "No compliance-scoped stories to check."
            echo "status=PASS" >> $GITHUB_OUTPUT
            exit 0
          fi

          all_passed=true
          results_json="{\"checked_stories\": [], \"failed_stories\": []}"

          for story in $stories; do
            if [ ! -f ".keel/state/$story/manifest.json" ]; then
              continue
            fi

            # Get current phase (default to 1 if not set)
            phase=$(grep -o '"current_phase": [0-9]*' ".keel/state/$story/manifest.json" | grep -o '[0-9]*')
            phase=${phase:-1}

            # Run compliance evaluator for this story
            node -e "
              const {evaluateCompliance} = require('./lib/compliance-evaluator.cjs');
              const manifest = require('./.keel/state/$story/manifest.json');
              const result = evaluateCompliance({
                storyId: '$story',
                phase: $phase,
                manifest: manifest,
                cwd: process.cwd(),
                entryPoint: 'github-actions'
              });
              console.log(JSON.stringify(result, null, 2));
              process.exit(result.passed ? 0 : 1);
            " > /tmp/$story-compliance.json 2>&1

            exit_code=$?
            if [ $exit_code -ne 0 ]; then
              all_passed=false
              echo "❌ $story: Compliance check FAILED"
              cat /tmp/$story-compliance.json
            else
              echo "✓ $story: Compliance check PASSED"
            fi
          done

          if [ "$all_passed" = false ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Report results to PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Compliance Check Failed\n\nOne or more compliance-scoped stories failed their compliance checks. See the job logs above for details.\n\n**Required action:** Fix the compliance issues or contact the compliance team if you believe this is a false positive.`
            })

      - name: Set check status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.compliance.outputs.status }}' === 'PASS' ? 'success' : 'failure';
            github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Compliance Check',
              head_sha: context.sha,
              status: 'completed',
              conclusion: status,
              output: {
                title: 'Compliance Evaluation',
                summary: status === 'success' ? 'All compliance checks passed' : 'Compliance check failed — see job logs'
              }
            });

