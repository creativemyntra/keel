  finding_KEEL-AUDIT-M001:
    id: KEEL-AUDIT-M001
    severity: HIGH
    phase: 20
    category: packaging
    title: "package.json engines.node '>=16.0.0' contradicts >=18 requirement"
    evidence:
      - "package.json:50: \"node\": \">=16.0.0\""
      - "INSTALL.md: '>=18 required'"
      - "TECHNICAL-SPECIFICATIONS.md: '>=18.0.0 required (Playwright E2E requires 18)'"
      - "keel-state.cjs:771: fs.rmSync(d, {recursive:true, force:true}) → needs Node 16+, not 18+"
    impact: >
      npm install on Node 16 or 17 succeeds with no warning. Plugin loads.
      First E2E phase fails with Playwright runtime error. User must diagnose
      version mismatch without guidance from npm.
    remediation: "package.json:50 → \"node\": \">=18.0.0\""

  finding_KEEL-AUDIT-M002:
    id: KEEL-AUDIT-M002
    severity: MEDIUM
    phase: 20
    category: packaging
    title: "npm package files array omits all documentation; README ships with dead links"
    evidence:
      - "package.json files: no INSTALL.md, QUICK-START-CLAUDE-CODE.md, ALL-AGENTS-COMPLETE-GUIDE.md"
      - "package.json files: no TECHNICAL-SPECIFICATIONS.md, CHANGELOG.md, docs/"
      - "README.md (shipped) contains relative links: [INSTALL.md](INSTALL.md), [ALL-AGENTS-COMPLETE-GUIDE.md](...)"
    impact: >
      After `npm install -g @amarsingh/keel`, every relative .md link in README is dead.
      User cannot follow getting-started links. CHANGELOG, INSTALL, and all docs are absent.
    remediation: >
      Add to package.json files: "INSTALL.md", "QUICK-START-CLAUDE-CODE.md",
      "ALL-AGENTS-COMPLETE-GUIDE.md", "TECHNICAL-SPECIFICATIONS.md", "CHANGELOG.md", "docs/"
      — or rewrite README links to point to GitHub (absolute URLs).

