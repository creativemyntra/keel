# ─────────────────────────────────────────────────────────────────────────────
# PHASE 18 — RELEASE / TAG HYGIENE
# ─────────────────────────────────────────────────────────────────────────────
phase_18_tag_hygiene:
  result: FINDINGS

  finding_KEEL-AUDIT-022:
    id: KEEL-AUDIT-022
    severity: CRITICAL
    phase: 18
    category: release-integrity
    title: "v3.16.8 tag predates Part A fix commit — tagged release is audit-dirty"
    evidence:
      - "git rev-list -n1 v3.16.8 → 38e9bdaca4f416f85286f8025d088a2cd1cd68e5"
      - "git rev-parse HEAD        → a29aa2268da8361af32d546d0d2c78ed34289e15"
      - "git describe --tags --abbrev=0 → v3.16.3 (HEAD not reachable forward from tag)"
    impact: >
      Users who install from the tagged release (npm, GitHub archive, git checkout v3.16.8)
      receive code with all 21 Part A findings unfixed — including CRIT injection-guard bypass
      (KEEL-AUDIT-004, KEEL-AUDIT-006) and zero gate/watch test coverage.
      The remote tag at origin also points to the old SHA.
    remediation: >
      git tag -d v3.16.8 && git push origin :refs/tags/v3.16.8
      git tag -a v3.16.8 HEAD -m "v3.16.8 — post-audit fix (Part A findings resolved)"
      git push origin v3.16.8

  finding_KEEL-AUDIT-023:
    id: KEEL-AUDIT-023
    severity: LOW
    phase: 18
    category: release-hygiene
    title: "No floating convenience tags (v3, v3.16) present"
    evidence:
      - "git tag -l 'v3' 'v3.16' → (empty)"
    impact: "Users cannot pin to major/minor without knowing exact patch version."
    remediation: "git tag -f v3 HEAD && git tag -f v3.16 HEAD && git push --tags"

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 19 — GITHUB ACTION CONTRACT
# ─────────────────────────────────────────────────────────────────────────────
phase_19_github_action:
  result: FINDINGS

  finding_KEEL-AUDIT-024:
    id: KEEL-AUDIT-024
    severity: CRITICAL
    phase: 19
    category: ci-integrity
    title: "collect-outputs step unconditionally hardcodes success outputs"
    evidence:
      - "action.yml:131: id: collect-outputs"
      - "action.yml:135: echo \"result=completed\" >> \"$GITHUB_OUTPUT\""
      - "action.yml:136: echo \"confidence=high\" >> \"$GITHUB_OUTPUT\""
      - "action.yml:137: echo \"lane2-ready=true\" >> \"$GITHUB_OUTPUT\""
    impact: >
      Any CI workflow reading ${{ steps.keel.outputs.result }},
      ${{ steps.keel.outputs.confidence }}, or ${{ steps.keel.outputs.lane2-ready }}
      always sees completed/high/true regardless of whether keel.js succeeded,
      failed, or was never reached. Gate consumers get false positives unconditionally.
      This renders the action's output contract meaningless.
    remediation: >
      Parse the actual keel.js exit code and stdout. Write real values to GITHUB_OUTPUT.
      At minimum: result=failed on non-zero exit, confidence from JSON stdout, lane2-ready
      only when all phases PASS.

  finding_KEEL-AUDIT-025:
    id: KEEL-AUDIT-025
    severity: HIGH
    phase: 19
    category: auth
    title: "claude-api-key input declared but never wired to any env var"
    evidence:
      - "action.yml: claude-api-key input declared as optional, no description"
      - "grep -n 'ANTHROPIC_API_KEY|claude.api.key|CLAUDE_API_KEY' action.yml → (no matches)"
    impact: >
      Users who set claude-api-key: ${{ secrets.CLAUDE_API_KEY }} in their workflow
      expect authentication to work. The key is silently discarded. keel.js will fail
      to authenticate against the Anthropic API. No error or warning is emitted.
    remediation: >
      In the keel run step, add: env: { ANTHROPIC_API_KEY: "${{ inputs.claude-api-key }}" }

  finding_KEEL-AUDIT-026:
    id: KEEL-AUDIT-026
    severity: HIGH
    phase: 19
    category: injection
    title: "Unquoted shell interpolations in action.yml run blocks"
    evidence:
      - "action.yml: --goal=\"${{ inputs.goal }}\" (double-quotes inside double-quotes)"
      - "action.yml: --story=\"${{ inputs.story }}\""
    impact: >
      If a workflow passes inputs containing shell metacharacters (semicolons, backticks,
      dollar signs), the interpolation executes arbitrary commands. GitHub Actions does not
      sanitize inputs before shell expansion in run: blocks.
    remediation: >
      Pass values through env vars, not inline interpolation:
        env:
          KEEL_GOAL: ${{ inputs.goal }}
        run: node "$GITHUB_ACTION_PATH/bin/keel.js" --goal="$KEEL_GOAL"

