# Keel Branch Promotion Strategy & Enforcement Rules
# Governs all git workflows - no exceptions
# Violations block push at pre-push hook stage

version: ".18.1"
enforcement: "strict"  # fail-closed: violations block push

# Promotion Pipeline: feat/* → dev → qa → stage → preprod → prod
# All commits MUST start on feature branch, NEVER directly on protected branches

branch_strategy:
  promotion_rules:
    # FEATURE BRANCHES: Direct push allowed
    # Pattern: feat/*, fix/*, hotfix/*, refactor/*, chore/*, docs/*, ci/*, style/*, build/*, release/*, spike/*
    # Naming convention: {prefix}/{jira-ticket}-{summary} OR {prefix}/{descriptive-name}
    # Examples:
    #   - feat/FEAT-123-user-authentication
    #   - feat/user-authentication
    #   - fix/BUG-456-payment-timeout
    #   - hotfix/critical-security-patch

    - source: "feat/*,fix/*,hotfix/*,refactor/*,chore/*,docs/*,ci/*,style/*,build/*,release/*,spike/*"
      target: "dev"
      allowed: true
      description: "Feature branches can push directly to dev"

    # PROTECTED BRANCHES: PR-only, no direct push
    # dev → qa (requires PR + review)
    - source: "dev"
      target: "qa"
      allowed: false
      description: "dev → qa requires PR (use gh pr create)"

    # qa → stage (requires PR + review)
    - source: "qa"
      target: "stage"
      allowed: false
      description: "qa → stage requires PR (use gh pr create)"

    # stage → preprod (requires PR + review)
    - source: "stage"
      target: "preprod"
      allowed: false
      description: "stage → preprod requires PR (use gh pr create)"

    # preprod → prod (requires PR + 2 approvals)
    - source: "preprod"
      target: "prod"
      allowed: false
      description: "preprod → prod requires PR with 2 approvals (use gh pr create)"

    # BLOCKED: Direct pushes to protected branches
    - source: "*"
      target: "dev,qa,stage,preprod,prod"
      allowed: false
      description: "Cannot push directly to protected branches (use PR workflow)"

  branch_naming:
    # Enforce branch naming convention
    required_prefix:
      - "feat/"     # New feature
      - "fix/"      # Bug fix
      - "hotfix/"   # Emergency production fix
      - "refactor/" # Code restructure (no behavior change)
      - "chore/"    # Maintenance, dependency updates
      - "docs/"     # Documentation only
      - "ci/"       # CI/CD pipeline changes
      - "style/"    # Formatting, whitespace (no logic change)
      - "build/"    # Build system changes
      - "release/"  # Release preparation
      - "spike/"    # Experimental/exploration branch

    naming_pattern: "^(feat|fix|hotfix|refactor|chore|docs|ci|style|build|release|spike)/([A-Z]+-\\d+|[a-z0-9-]+)$"
    # Matches: feat/FEAT-123-description OR feat/descriptive-name

  protected_branches:
    # Branches that require PR for any changes
    - "dev"
    - "qa"
    - "stage"
    - "preprod"
    - "prod"
    - "main"      # Alias for prod (if used)
    - "master"    # Legacy - same as main

  gateway_rules:
    # Require PR approval before merge
    dev:
      min_approvals: 1
      dismiss_stale_reviews: true
      require_status_checks: true
      enforce_admins: false  # Admins can still merge without approval (G-2 gate)

    qa:
      min_approvals: 1
      dismiss_stale_reviews: true
      require_status_checks: true

    stage:
      min_approvals: 1
      dismiss_stale_reviews: true
      require_status_checks: true

    preprod:
      min_approvals: 1
      dismiss_stale_reviews: true
      require_status_checks: true

    prod:
      min_approvals: 2  # Release requires 2 approvals (G-2)
      dismiss_stale_reviews: true
      require_status_checks: true
      require_code_owner_review: false

  governance_gates:
    # Enforce Keel governance guardrails
    G-2_approval_required: true
    # "Releasing, deploying, committing, pushing, tagging, or merging branches"
    # requires explicit human approval

    G-13_pr_first_policy: true
    # "Direct pushes to protected branches are forbidden"
    # "Every code change reaches protected branch only through reviewed PR"

  enforcement_actions:
    on_violation: "block_push"
    # Block push immediately with clear error message

    error_template: |
      ❌ BLOCKED: Branch strategy violation

      Source: {source_branch}
      Target: {target_branch}
      Reason: {rule_description}

      ✅ What to do instead:
      {guidance}

      📋 See CLAUDE.md G-13 for full policy

# Emergency override (requires explicit human confirmation)
# override_token: "EMERGENCY_OVERRIDE_TOKEN"
# NEVER use without explicit written approval from project owner
